name: Deploy diagnostics v6 — read logs via compress trick, cwd oracle, respawn loop

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read real logs + kill orphan via hook + respawn
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN"
          J="https://$CPANEL_HOST:2083"
          call() { curl -s --max-time 90 -H "$AUTH" "$1"; }
          HOMEQ=$(printf '%%2Fhome%%2F%s' "$CPANEL_USER")
          APP="$HOMEQ%2Fkermani-app"
          UP="$APP%2Fdata%2Fuploads"

          echo "===== 1) compress key files into zips ====="
          echo "-- zip stderr.log:"
          call "$J/execute/Fileman/compress_files?dir=$APP&zipfile=diag-stderr.zip&compress_type=zip&files=stderr.log" | head -c 220; echo
          echo "-- zip server.js:"
          call "$J/execute/Fileman/compress_files?dir=$APP&zipfile=diag-serverjs.zip&compress_type=zip&files=server.js" | head -c 220; echo
          echo "-- zip .htaccess:"
          call "$J/execute/Fileman/compress_files?dir=$HOMEQ%2Fpublic_html&zipfile=diag-htaccess.zip&compress_type=zip&files=.htaccess" | head -c 220; echo
          echo "-- zip tmp dir files:"
          call "$J/execute/Fileman/compress_files?dir=$APP%2Ftmp&zipfile=diag-tmp.zip&compress_type=zip&files=restart.txt,always_restart.txt" | head -c 220; echo

          echo "===== 2) move zips into data/uploads ====="
          for Z in diag-stderr diag-serverjs diag-tmp; do
            echo "-- copy $Z.zip:"
            call "$J/execute/Fileman/copy_file?source=$APP%2F$Z.zip&destination=$UP%2F$Z.zip" | head -c 220; echo
          done
          echo "-- copy htaccess zip:"
          call "$J/execute/Fileman/copy_file?source=$HOMEQ%2Fpublic_html%2Fdiag-htaccess.zip&destination=$UP%2Fdiag-htaccess.zip" | head -c 220; echo

          echo "===== 3) fetch zips via the live app ====="
          sleep 2
          mkdir -p /tmp/diagz && cd /tmp/diagz
          for Z in diag-stderr diag-serverjs diag-tmp diag-htaccess; do
            curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/uploads/$Z.zip" -o "$Z.zip" || true
            echo "-- $Z.zip size: $(wc -c < $Z.zip 2>/dev/null)"
            unzip -o -q "$Z.zip" -d "$Z-x" 2>/dev/null && find "$Z-x" -type f | head -5
          done
          echo "########## stderr.log (tail 3500) ##########"
          tail -c 3500 /tmp/diagz/diag-stderr-x/stderr.log 2>/dev/null || echo "(not fetched)"
          echo
          echo "########## server.js (full) ##########"
          cat /tmp/diagz/diag-serverjs-x/server.js 2>/dev/null || echo "(not fetched)"
          echo
          echo "########## .htaccess (full) ##########"
          cat /tmp/diagz/diag-htaccess-x/.htaccess 2>/dev/null || echo "(not fetched)"
          echo
          echo "########## tmp dir files ##########"
          find /tmp/diagz/diag-tmp-x -type f -exec sh -c 'echo "--- {}"; cat "{}"' \; 2>/dev/null || echo "(not fetched)"

          echo "===== 4) cwd oracle: dummy tarballs + hook POST ====="
          echo "-- dummy in HOME root:"
          call "$J/execute/Fileman/save_file_content?dir=$HOMEQ&file=deploy-package.tar.gz&content=DIAG-DUMMY" >/dev/null && echo "written"
          echo "hook => $(curl -s -X POST --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/api/deploy-hook" | head -c 200)"
          echo "-- dummy in kermani-app/.next/standalone:"
          call "$J/execute/Fileman/save_file_content?dir=$APP%2F.next%2Fstandalone&file=deploy-package.tar.gz&content=DIAG-DUMMY" >/dev/null && echo "written"
          echo "hook => $(curl -s -X POST --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/api/deploy-hook" | head -c 200)"

          echo "===== 5) respawn loop: touch restart.txt + GET / ====="
          for i in 1 2 3 4 5 6; do
            call "$J/execute/Fileman/save_file_content?dir=$APP%2Ftmp&file=restart.txt&content=restart-diag-$(date +%s)" >/dev/null || true
            sleep 15
            curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/" -o /tmp/v6.html || true
            echo "round $i: dr-surgon=$(grep -c 'dr-surgon.png' /tmp/v6.html) dr-portrait=$(grep -c 'clinic/dr-portrait' /tmp/v6.html) heading-fluid=$(grep -c 'heading-fluid' /tmp/v6.html) size=$(wc -c < /tmp/v6.html) code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H 'Host: dr-kermani.com' http://213.176.126.162/)"
          done
