name: Server diagnostics v2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe server state
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN"
          J="https://$CPANEL_HOST:2083"
          api() { curl -sf --max-time 90 -H "$AUTH" "$1"; }
          HOMEDIR=$(printf '%%2Fhome%%2F%s' "$CPANEL_USER")

          echo "===== A) kermani-app listing (fixed jq) ====="
          api "$J/execute/Fileman/list_files?dir=$HOMEDIR%2Fkermani-app&show_hidden=1" > /tmp/l1.json || echo "(fetch failed)"
          jq -r '.data[]? | "\(.type)\t\(.mtime)\t\(.size)\t\(.file)"' /tmp/l1.json 2>/dev/null | sort -k4 | head -40
          echo "raw head: $(head -c 300 /tmp/l1.json)"

          echo "===== B) home listing (files top-level) ====="
          api "$J/execute/Fileman/list_files?dir=$HOMEDIR&show_hidden=1" > /tmp/l2.json || echo "(fetch failed)"
          jq -r '.data[]? | "\(.type)\t\(.mtime)\t\(.size)\t\(.file)"' /tmp/l2.json 2>/dev/null | sort -k4 | head -40

          echo "===== C) nested-dir hypothesis: home/home/USER ====="
          api "$J/execute/Fileman/list_files?dir=$HOMEDIR%2Fhome%2F$CPANEL_USER%2Fkermani-app&show_hidden=1" > /tmp/l3.json || echo "(fetch failed)"
          jq -r '.data[]? | "\(.type)\t\(.mtime)\t\(.size)\t\(.file)"' /tmp/l3.json 2>/dev/null | head -30
          echo "raw head: $(head -c 300 /tmp/l3.json)"

          echo "===== D) NodeJSMgmt function discovery ====="
          for FN in listapps list_apps lsapps getapps app_list restartapp restart_app startapp stopapp stateapp statusapp status; do
            R=$(curl -sk --max-time 30 -H "$AUTH" "$J/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=NodeJSMgmt&cpanel_jsonapi_func=$FN" | head -c 200)
            echo "$FN => $R"
          done

          echo "===== E) site marker now ====="
          curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/" -o /tmp/site.html || true
          echo "dr-surgon=$(grep -c 'dr-surgon.png' /tmp/site.html) heading-fluid=$(grep -c 'heading-fluid' /tmp/site.html) bg-ink24=$(grep -c 'bg-ink py-24' /tmp/site.html)"
