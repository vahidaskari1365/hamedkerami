name: Server diagnostics v4 — stderr via /uploads + always_restart test

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Expose server logs through the app and test always_restart
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN"
          J="https://$CPANEL_HOST:2083"
          api() { curl -sf --max-time 90 -H "$AUTH" "$1"; }
          call() { curl -s --max-time 90 -H "$AUTH" "$1"; }
          HOMEDIR=$(printf '%%2Fhome%%2F%s' "$CPANEL_USER")
          APP="$HOMEDIR%2Fkermani-app"

          echo "===== 1) ensure data/uploads exists ====="
          call "$J/execute/Fileman/mkdir?path=$APP%2Fdata%2Fuploads" | head -c 200; echo

          echo "===== 2) copy diag files into data/uploads ====="
          echo "-- stderr.log:"
          call "$J/execute/Fileman/copy_file?dir=$APP&file=stderr.log&destdir=$APP%2Fdata%2Fuploads&destname=diag-stderr.log" | head -c 250; echo
          echo "-- server.js:"
          call "$J/execute/Fileman/copy_file?dir=$APP&file=server.js&destdir=$APP%2Fdata%2Fuploads&destname=diag-serverjs.txt" | head -c 250; echo
          echo "-- public_html/.htaccess:"
          call "$J/execute/Fileman/copy_file?dir=$HOMEDIR%2Fpublic_html&file=.htaccess&destdir=$APP%2Fdata%2Fuploads&destname=diag-htaccess.txt" | head -c 250; echo

          echo "===== 3) read them via the live app ====="
          sleep 2
          echo "---------- stderr.log (tail 3500) ----------"
          curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/uploads/diag-stderr.log" | tail -c 3500
          echo
          echo "---------- server.js (head 500) ----------"
          curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/uploads/diag-serverjs.txt" | head -c 500
          echo
          echo "---------- .htaccess (full) ----------"
          curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/uploads/diag-htaccess.txt" | head -c 1200
          echo

          echo "===== 4) always_restart.txt test ====="
          call "$J/execute/Fileman/save_file_content?dir=$APP%2Ftmp&file=always_restart.txt&content=diag" >/dev/null && echo "always_restart.txt created"
          for i in 1 2 3; do
            sleep 12
            curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/" -o /tmp/ar.html || true
            echo "try $i: dr-surgon=$(grep -c 'dr-surgon.png' /tmp/ar.html) dr-portrait=$(grep -c 'clinic/dr-portrait' /tmp/ar.html) heading-fluid=$(grep -c 'heading-fluid' /tmp/ar.html) size=$(wc -c < /tmp/ar.html)"
          done
          echo "-- cleanup always_restart.txt:"
          call "$J/execute/Fileman/unlink_file?dir=$APP%2Ftmp&file=always_restart.txt" | head -c 200; echo
          echo "===== 5) kermani-app listing after test ====="
          api "$J/execute/Fileman/list_files?dir=$APP&show_hidden=1" > /tmp/lf.json || true
          jq -r '.data[]? | "\(.type)\t\(.mtime)\t\(.size)\t\(.file)"' /tmp/lf.json 2>/dev/null | head -20
