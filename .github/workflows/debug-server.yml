name: Cleanup diag files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Neutralize diagnostic copies exposed under /uploads
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN"
          J="https://$CPANEL_HOST:2083"
          call() { curl -s --max-time 90 -H "$AUTH" "$1"; }
          HOMEQ=$(printf '%%2Fhome%%2F%s' "$CPANEL_USER")
          APP="$HOMEQ%2Fkermani-app"
          UP="$APP%2Fdata%2Fuploads"
          for F in deadbeef-a.png deadbeef-b.png deadbeef-c.png deadbeef-d.png; do
            call "$J/execute/Fileman/save_file_content?dir=$UP&file=$F&content=cleaned" >/dev/null && echo "neutralized: $F"
          done
          echo "-- dummy tarball in HOME root (from cwd oracle):"
          call "$J/execute/Fileman/save_file_content?dir=$HOMEQ&file=deploy-package.tar.gz&content=x" >/dev/null && echo "shrunk"
