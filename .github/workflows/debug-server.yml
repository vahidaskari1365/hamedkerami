name: Server diagnostics v5 — PHP recon (processes, cwd, stderr)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Drop self-deleting PHP recon + run it
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN"
          J="https://$CPANEL_HOST:2083"
          call() { curl -s --max-time 90 -H "$AUTH" "$1"; }
          HOMEDIR=$(printf '%%2Fhome%%2F%s' "$CPANEL_USER")

          echo "$B64" | base64 -d > /tmp/recon.php
          echo "===== 1) write diag.php ====="
          call "$J/execute/Fileman/save_file_content?dir=$HOMEDIR%2Fpublic_html&file=diag.php" \
            -F "content=</tmp/recon.php" | head -c 200; echo
          echo "===== 2) GET /diag.php (with domain Host) ====="
          curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/diag.php" | head -c 6000
          echo
          echo "===== 3) GET /diag.php (no Host, direct) ====="
          curl -s --max-time 60 "http://213.176.126.162/diag.php" | head -c 3000
          echo
          echo "===== 4) hook POST ====="
          curl -s -X POST --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/api/deploy-hook" | head -c 200
          echo
          sleep 15
          echo "===== 5) markers ====="
          curl -s --max-time 60 -H "Host: dr-kermani.com" "http://213.176.126.162/" -o /tmp/v5.html || true
          echo "dr-surgon=$(grep -c 'dr-surgon.png' /tmp/v5.html) dr-portrait=$(grep -c 'clinic/dr-portrait' /tmp/v5.html) heading-fluid=$(grep -c 'heading-fluid' /tmp/v5.html) size=$(wc -c < /tmp/v5.html)"
        env:
          B64: 
