name: Blog Agent (2 articles/day — 07:00 Tehran)

# ایجنت محتوایی سایت: هر روز ۰۷:۰۰ به وقت ایران (۰۳:۳۰ UTC) دو مقاله بعدی
# صف ۲۴ مقاله‌ای با ۵ ایجنت (استراتژیست/نویسنده/سئوکار/تصویرساز ۳D/سردبیر)
# تولید و منتشر می‌شود؛ سایت‌مپ و llms.txt داینامیک خودکار به‌روز می‌شوند.
#
# معماری: تولید در رانر گیت‌هاب (اینترنت کامل + کلید SDK از secret
# ZAI_CONFIG_B64 — همان کلید سرور) → POST /api/agents/publish به سرور
# (سردبیر QC + چک یکتایی + ذخیره در دیتابیس). دلیل: خروجی شبکه هاست
# اشتراکی به API هوش مصنوعی نامطمئن است (خطای fetch failed).
# زمان‌بند داخلی سرور (۰۷:۰۰-۰۹:۵۹ تهران) پشتیبان است؛ جلوگیری از تکرار
# با عناوین منتشرشده (queue endpoint) + قفل روزانه سرور انجام می‌شود.

on:
  schedule:
    - cron: "30 3 * * *" # ۰۷:۰۰ تهران = ۰۳:۳۰ UTC (ایران DST ندارد)
  workflow_dispatch: # اجرای دستی از تب Actions

env:
  SITE_URL: https://dr-kermani.com

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  generate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: QA مخزن مقاله‌ها (قرارداد docs/standards.md)
        run: bun scripts/qa-articles.ts

      - name: Setup ZAI config (کلید SDK هوش مصنوعی)
        run: |
          echo "${{ secrets.ZAI_CONFIG_B64 }}" | base64 -d > .z-ai-config
          SIZE=$(wc -c < .z-ai-config)
          echo "config size: $SIZE bytes"
          [ "$SIZE" -gt 50 ] || { echo "::error::ZAI_CONFIG_B64 secret خالی/خراب است"; exit 1; }

      - name: Generate & publish 2 articles
        env:
          SITE_URL: ${{ env.SITE_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: bun scripts/blog-agent/generate.mjs

      - name: Fallback — trigger server pipeline (اگر رانر تولید نکرد)
        if: failure()
        run: |
          code=$(curl -s -o /tmp/agent.json -w "%{http_code}" -X POST --max-time 90 \
            -H "x-agent-key: ${{ secrets.AGENT_SECRET }}" \
            "${{ env.SITE_URL }}/api/agents/daily" || echo "000")
          echo "server pipeline trigger → HTTP $code : $(head -c 200 /tmp/agent.json 2>/dev/null)"
          # خروجی fail نیست — سرور فقط پشتیبان است و خطایش در /api/agents/daily دیده می‌شود

      - name: Report queue state
        if: always()
        run: |
          sleep 5
          curl -s --max-time 60 -H "x-agent-key: ${{ secrets.AGENT_SECRET }}" \
            "${{ env.SITE_URL }}/api/agents/queue" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('published:', d.get('totalPublished')); print('next:', *[t['title'] for t in d.get('pending',[])], sep='\n  ')" \
            || echo "queue report ناموفق"
