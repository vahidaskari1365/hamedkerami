name: Build & Deploy to IranHost (cPanel UAPI)

# هر push به main → بیلد در گیت‌هاب → آپلود پکیج فشرده با UAPI → بوت‌استرپ اکسترکت و ری‌استارت
# (FTP این هاست کانال دیتایش فایروال است و SSH هم بسته — پس همه‌چیز از HTTPS پورت 2083 می‌گذرد)
on:
  push:
    branches: [main] # fix: قبلاً «ain]» تایپ شده بود و push به main هرگز دیپلوی خودکار تریگر نمی‌کرد
  workflow_dispatch: # اجرای دستی از تب Actions

env:
  APP_DIR: /home/drkerman/kermani-app
  SITE_HOST: dr-kermani.com
  SITE_IP: 213.176.126.162

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # تا توکن cPanel ست نشده، فقط بیلد سبز می‌شود و دیپلوی skip است
      DEPLOY_READY: ${{ secrets.CPANEL_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client (با موتورهای لینوکسی هاست)
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:/tmp/build.db"

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/build.db"
          NEXT_TELEMETRY_DISABLED: "1"
          # Google Analytics 4 — استریم dr-kermani (بیلدتایم اینلاین می‌شود)
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-BN9YBGCWSY"

      # ---------- بسته‌بندی ----------
      - name: Assemble deploy package
        run: |
          set -e
          rm -rf deploy/.next deploy/server.js deploy/prisma deploy/db deploy/tmp
          mkdir -p deploy/db deploy/tmp deploy/.next
          cp -r .next/standalone deploy/.next/standalone
          cp server.js deploy/server.js
          cp -r prisma deploy/prisma
          cp db/init.db deploy/db/init.db
          echo "restart-$(date +%s)" > deploy/tmp/restart.txt
          rm -rf deploy/.next/standalone/node_modules/.cache 2>/dev/null || true
          du -sh deploy/* 2>/dev/null || true

      - name: Create tarball
        run: tar -czf /tmp/deploy-package.tar.gz -C deploy . && ls -lh /tmp/deploy-package.tar.gz

      # ---------- دیپلوی با cPanel UAPI (HTTPS:2083) ----------
      - name: Upload package via UAPI
        if: env.DEPLOY_READY == 'true'
        run: |
          curl -sf --retry 3 --retry-delay 5 --max-time 1800 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            -F "dir=${{ env.APP_DIR }}" \
            -F "overwrite=1" \
            -F "file=@/tmp/deploy-package.tar.gz" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/upload_files" \
            | head -c 300; echo

      - name: Install bootstrap server.js + restart Passenger via UAPI
        if: env.DEPLOY_READY == 'true'
        run: |
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"
          API="https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman"
          # بوت‌استرپ = همان server.js مخزن (تک منبع حقیقت — دیگر heredoc تکراری نیست):
          # پکیج در staging اکسترکت می‌شود → تأیید سلامت → تعویض اتمیک کل .next
          # (قبلاً tar مستقیم روی ROOT باز می‌شد و باندل‌های قدیمی مثل sitemap.xml
          #  از بیلدهای قبل روی سرور می‌ماندند و نسخه کهنه سرو می‌شد)
          cp server.js /tmp/bootstrap.js
          curl -sf --retry 3 --retry-delay 5 --max-time 120 \
            -H "$AUTH" \
            -F "dir=${{ env.APP_DIR }}" \
            -F "file=server.js" \
            -F "overwrite=1" \
            -F "content=</tmp/bootstrap.js" \
            "$API/save_file_content" >/dev/null
          # سیگنال ری‌استارت Passenger
          curl -sf --retry 3 --retry-delay 5 --max-time 120 \
            -H "$AUTH" \
            -F "dir=${{ env.APP_DIR }}/tmp" \
            -F "file=restart.txt" \
            -F "overwrite=1" \
            -F "content=restart-$(date +%s)" \
            "$API/save_file_content" >/dev/null
          echo "bootstrap + restart signal OK"

      - name: Trigger restart (deploy-hook → پروسه قدیمی خاموش، Passenger تازه می‌سازد)
        if: env.DEPLOY_READY == 'true'
        run: |
          # پروسه فعال اگر route داشته باشد با 200 پاسخ می‌دهد و exit می‌کند (پکیج در انتظار هست)
          code=$(curl -s -o /tmp/hook.json -w "%{http_code}" -X POST --max-time 60 \
            -H "Host: ${{ env.SITE_HOST }}" \
            "http://${{ env.SITE_IP }}/api/deploy-hook" || echo "000")
          echo "deploy-hook → HTTP $code : $(cat /tmp/hook.json 2>/dev/null | head -c 200)"
          if [ "$code" = "404" ]; then
            echo "::warning::پروسه فعال route جدید را ندارد (اولین دیپلوی با این سازوکار) — بعد از یک ری‌استارت دستی (Setup Node.js App → Restart) همه دیپلوی‌های بعدی کاملاً خودکار می‌شوند"
          fi

      - name: Wake app & verify (اکسترکت و استارت واقعی اینجا رخ می‌دهد)
        if: env.DEPLOY_READY == 'true'
        run: |
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"
          LIST="https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/list_files?dir=${{ env.APP_DIR }}&types=file&show_hidden=1"
          for i in 1 2 3 4 5 6 7 8; do
            # بیدارباش → اگر پروسه مرده باشد Passenger بوت‌استرپ را با پکیج تازه اجرا می‌کند
            code=$(curl -s -o /tmp/wake.html -w "%{http_code}" \
              -H "Host: ${{ env.SITE_HOST }}" --max-time 240 \
              "http://${{ env.SITE_IP }}/" || echo "000")
            # فهرست پوشه اپ — اگر خود فراخوانی شکست بخورد، «مصرف‌نشده» فرض می‌شود (نه موفقیت کاذب)
            tarball=1
            if curl -sf --max-time 60 -H "$AUTH" "$LIST" -o /tmp/list.json; then
              tarball=$(grep -c "deploy-package.tar.gz" /tmp/list.json || true)
            fi
            echo "attempt $i → HTTP $code | pending-package-on-server: $tarball"
            if [ "$code" = "200" ] && [ "$tarball" = "0" ]; then
              echo "✅ پکیج تازه اکسترکت و سرو شد — دیپلوی کامل موفق"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::پکیج هنوز مصرف نشده — احتمالاً پروسه قدیمی زنده است. یک‌بار Restart دستی بزنید (Setup Node.js App → Restart)؛ از دیپلوی بعدی همه‌چیز خودکار است."

      # LSCache صفحه را با s-maxage یک‌ساله کش می‌کند؛ این endpoint با هدر
      # X-LiteSpeed-Purge: * کل کش صفحات vhost را خالی می‌کند تا نسخه تازه فوراً دیده شود
      - name: Purge LiteSpeed page cache
        if: env.DEPLOY_READY == 'true'
        run: |
          code=$(curl -s -o /tmp/purge.txt -w "%{http_code}" --max-time 60 \
            -H "Host: ${{ env.SITE_HOST }}" \
            "http://${{ env.SITE_IP }}/__cache-purge" || echo "000")
          echo "purge → HTTP $code : $(head -c 100 /tmp/purge.txt)"

      # ── کاناری سئو: اگر سایت‌مپ قدیمی سرو شود (کش LSCache / state مخلوط .next)
      # دیپلوی قرمز می‌شود تا فوراً بفهمیم — نه هفته‌ها بعد در Search Console
      - name: Verify sitemap freshness (SEO canary)
        if: env.DEPLOY_READY == 'true'
        run: |
          sleep 5
          SM=$(curl -sf --max-time 60 "https://${{ env.SITE_HOST }}/sitemap.xml" || echo "")
          echo "$SM" | head -c 300; echo
          fail=0
          echo "$SM" | grep -q "jaw-surgery-in-iran" || { echo "::error::sitemap: EN landing missing — stale sitemap served"; fail=1; }
          echo "$SM" | grep -q "<loc>${{ env.SITE_HOST }}/appointment</loc>" || { echo "::error::sitemap: /appointment missing"; fail=1; }
          echo "$SM" | grep -q "xhtml:link" || { echo "::error::sitemap: hreflang alternates missing"; fail=1; }
          n=$(echo "$SM" | grep -c "<loc>" || true)
          echo "sitemap URLs: $n (expected ≥ 30)"
          [ "$n" -ge 30 ] || { echo "::error::sitemap: too few URLs — stale build?"; fail=1; }
          exit $fail

      - name: Done (بدون دیپلوی — فقط بیلد)
        if: env.DEPLOY_READY != 'true'
        run: echo "بیلد سبز بود؛ دیپلوی skip شد چون CPANEL_API_TOKEN ست نیست."
