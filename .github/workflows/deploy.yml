name: Build & Deploy to IranHost (cPanel over SSH)

# هر push به main → بیلد در گیت‌هاب → rsync امن با کلید SSH به هاست → ری‌استارت خودکار
on:
  push:
    branches: [main]
  workflow_dispatch: # اجرای دستی از تب Actions

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client (با موتورهای لینوکسی هاست)
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:/tmp/build.db"

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/build.db"
          NEXT_TELEMETRY_DISABLED: "1"

      # ---------- بسته‌بندی فایل‌هایی که باید روی هاست بروند ----------
      - name: Assemble deploy package
        run: |
          set -e
          mkdir -p deploy/db deploy/tmp
          # سرور standalone + فایل‌های استاتیک (build script خودش کپی کرده)
          mv .next/standalone deploy/.next-standalone
          mkdir -p deploy/.next
          mv deploy/.next-standalone deploy/.next/standalone
          # ورودی Passenger + اسکیما + دیتابیس آماده + اسکریپت راه‌اندازی
          cp server.js deploy/server.js
          cp -r prisma deploy/prisma
          cp db/init.db deploy/db/init.db
          cp deploy/setup.sh deploy/setup.sh
          # restart.txt با محتوای متفاوت در هر اجرا → آپلود می‌شود → Passenger ری‌استارت می‌شود
          echo "restart-$(date +%s)" > deploy/tmp/restart.txt
          # حذف آرتیفکت‌های سنگین بی‌استفاده از node_modules standalone
          rm -rf deploy/.next/standalone/node_modules/.cache || true
          echo "---- deploy tree (top) ----"
          du -sh deploy/* 2>/dev/null || true

      # ---------- دیپلوی امن با SSH (کلید، بدون رمز عبور) ----------
      - name: Deploy via SSH (rsync + remote setup)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "deploy/"
          # مقصد نسبت به home اکانت cPanel — پوشه‌ی اپ
          TARGET: "kermani-app/"
          # ⚠️ بدون --delete — دیتابیس (db/) و آپلودها (data/) هرگز حذف نمی‌شوند
          ARGS: "-rlgoDzvc -i"
          # بعد از rsync: دیتابیس/آپلودها آماده و Passenger ری‌استارت می‌شود
          SCRIPT_AFTER: |
            cd ~/kermani-app
            bash setup.sh

      # ---------- پلن جایگزین: FTP (اگر روزی SSH غیرفعال شد) ----------
      # Secrets لازم: FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / FTP_SERVER_DIR
      # - name: Deploy via FTP
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     port: 21
      #     protocol: ftp
      #     local-dir: deploy/
      #     server-dir: ${{ secrets.FTP_SERVER_DIR }}
      #     dangerous-cleaner: false
      #     log-level: minimal

      - name: Done
        run: echo "بیلد + rsync + setup.sh + ری‌استارت Passenger انجام شد."
