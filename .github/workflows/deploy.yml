name: Build & Deploy to IranHost (cPanel over SSH)

# هر push به main → بیلد در گیت‌هاب → rsync امن با کلید SSH به هاست → ری‌استارت خودکار
on:
  push:
    branches: [main]
  workflow_dispatch: # اجرای دستی از تب Actions

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # تا یوزرنیم FTP ست نشده، مرحله‌ی دیپلوی skip می‌شود (بیلد سبز می‌ماند)
      DEPLOY_READY: ${{ secrets.FTP_USERNAME != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client (با موتورهای لینوکسی هاست)
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:/tmp/build.db"

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/build.db"
          NEXT_TELEMETRY_DISABLED: "1"

      # ---------- بسته‌بندی فایل‌هایی که باید روی هاست بروند ----------
      - name: Assemble deploy package
        run: |
          set -e
          mkdir -p deploy/db deploy/tmp
          # سرور standalone + فایل‌های استاتیک (build script خودش کپی کرده)
          mv .next/standalone deploy/.next-standalone
          mkdir -p deploy/.next
          mv deploy/.next-standalone deploy/.next/standalone
          # ورودی Passenger + اسکیما + دیتابیس آماده + اسکریپت راه‌اندازی
          cp server.js deploy/server.js
          cp -r prisma deploy/prisma
          cp db/init.db deploy/db/init.db
          # (setup.sh از قبل داخل deploy/ هست — کپی روی خودش ممنوع)
          # restart.txt با محتوای متفاوت در هر اجرا → آپلود می‌شود → Passenger ری‌استارت می‌شود
          echo "restart-$(date +%s)" > deploy/tmp/restart.txt
          # حذف آرتیفکت‌های سنگین بی‌استفاده از node_modules standalone
          rm -rf deploy/.next/standalone/node_modules/.cache || true
          echo "---- deploy tree (top) ----"
          du -sh deploy/* 2>/dev/null || true

      # ---------- دیپلوی با FTP (SSH در این هاست بسته است) ----------
      # کش وضعیت → فقط فایل‌های تغییرکرده آپلود می‌شوند (دفعات بعد چند دقیقه)
      - name: Restore FTP state cache
        if: env.DEPLOY_READY == 'true'
        uses: actions/cache@v4
        with:
          path: deploy/.ftp-deploy-sync-state.json
          key: ftp-state-${{ github.run_id }}
          restore-keys: |
            ftp-state-

      - name: Deploy via FTP
        if: env.DEPLOY_READY == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftpes
          local-dir: deploy/
          # مسیر روی هاست نسبت به home اکانت cPanel
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # ⚠️ هرگز فایل‌های هاست حذف نشوند — دیتابیس و آپلودها امن می‌مانند
          dangerous-cleaner: false
          log-level: minimal

      # ---------- پلن جایگزین: SSH (اگر روزی هاست فعالش کرد) ----------
      # کلید ed25519 از قبل آماده و در cPanel authorized شده (scripts/deploy_ed25519)
      # Secrets لازم: SSH_HOST / SSH_PORT / SSH_PRIVATE_KEY / SSH_USERNAME
      # - name: Deploy via SSH (rsync + remote setup)
      #   uses: easingthemes/ssh-deploy@v5.1.0
      #   with:
      #     SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      #     REMOTE_HOST: ${{ secrets.SSH_HOST }}
      #     REMOTE_USER: ${{ secrets.SSH_USERNAME }}
      #     REMOTE_PORT: ${{ secrets.SSH_PORT }}
      #     SOURCE: "deploy/"
      #     TARGET: "kermani-app/"
      #     ARGS: "-rlgoDzvc -i"
      #     SCRIPT_AFTER: |
      #       cd ~/kermani-app
      #       bash setup.sh

      - name: Done
        run: echo "بیلد + آپلود FTP + ری‌استارت Passenger انجام شد (db در اولین بوت خودکار ساخته می‌شود)."
