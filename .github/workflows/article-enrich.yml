name: Article body enrichment (readability SXO)

# غنی‌سازی بدنه مقاله‌های قدیمی: انتشار content-fixes/<slug>.md از
# مسیر ایجنت (گیت سردبیر کامل) + پینگ IndexNow برای نسخه به‌روز.
# محتوای فایل‌ها با scripts/enrich-article-bodies.mjs محلی تولید و
# بازبینی شده (تقسیم پاراگراف بلند + توپر آماری + لینک داخلی).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "برای اجرا بنویسید: publish"
        required: true
        type: string

concurrency:
  group: article-fix
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish enriched bodies
        env:
          SITE_URL: https://dr-kermani.com
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "confirm=publish نیست — لغو شد"; exit 1
          fi
          node scripts/publish-body-files.mjs

      - name: IndexNow — پینگ Bing برای نسخه به‌روز
        if: always()
        run: node scripts/indexnow-submit.mjs --updated || echo "IndexNow ping ناموفق — مانع نیست"
