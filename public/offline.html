<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e0b">
<title>آفلاین هستید | دکتر حامد کرمانی</title>
<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("/fonts/Vazirmatn-Regular.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Vazirmatn";
    src: url("/fonts/Vazirmatn-Bold.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Vazirmatn", system-ui, -apple-system, sans-serif;
    background: #0d0e0b;
    color: #f6f3ea;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
    padding: 40px 28px 36px;
    border-radius: 24px;
    background: rgba(28, 29, 22, 0.75);
    border: 1px solid rgba(201, 161, 59, 0.3);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
  }
  .logo {
    width: 84px; height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(201, 161, 59, 0.12);
    color: #c9a13b;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  p  { font-size: 14px; line-height: 2; color: rgba(246, 243, 234, 0.75); margin-bottom: 24px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn, button.btn {
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    padding: 11px 22px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn-gold  { background: #c9a13b; color: #0d0e0b; border: none; }
  .btn-gold:hover  { background: #e9cf87; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: #f6f3ea; border: 1px solid rgba(255,255,255,0.25); }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); }
  .hint { margin-top: 22px; font-size: 12px; color: rgba(246, 243, 234, 0.45); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/images/logo.png" alt="لوگوی دکتر حامد کرمانی" aria-hidden="true">
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.1 2.4 5.5.9 1 1.6 2.2 1.6 3.5h6c0-1.3.7-2.5 1.6-3.5C17.8 13.1 19 11.4 19 9a7 7 0 0 0-7-7z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>
    <h1>اتصال اینترنت قطع است</h1>
    <p>
      نگران نباشید — صفحاتی که قبلاً دیده‌اید در حافظه اپ ذخیره شده‌اند.
      برای رزرو نوبت می‌توانید مستقیم تماس بگیرید؛ با وصل شدن دوباره اینترنت،
      همین صفحه به‌صورت خودکار در دسترس خواهد بود.
    </p>
    <div class="actions">
      <a class="btn btn-gold" href="tel:+982166921500">تماس با مطب</a>
      <button class="btn btn-ghost" onclick="location.reload()">تلاش دوباره</button>
    </div>
    <p class="hint">وب‌اپلیکیشن دکتر حامد کرمانی — جراحی فک و صورت</p>
  </main>
</body>
</html>
